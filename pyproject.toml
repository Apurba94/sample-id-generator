[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-id-generator"
version = "0.1.0"
description = "Generate unique sample IDs with check digits and printable label sheets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
sample-id-generator = "sample_id_generator.cli:main"

[tool.setuptools]
packages = ["sample_id_generator"]
